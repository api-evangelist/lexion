openapi: 3.0.1
info:
  title: Lexion API
  description: >-
    Lexion is an AI-powered contract lifecycle management (CLM) platform
    (intelligent repository, AI extraction/insights, no-code intake and
    approval workflows, and pre-built plus custom integrations). Lexion
    advertises a custom integration API to push contract terms and metadata
    into external business systems (e.g. NetSuite, Coupa), but this API is an
    enterprise, sales-led offering. As of this writing Lexion does NOT publish
    a self-serve, openly documented public REST API: there is no published base
    URL, authentication scheme, or endpoint reference. Lexion was acquired by
    Docusign in May 2024 (~$165M) and is being folded into Docusign's
    Intelligent Agreement Management (IAM) platform and Docusign Navigator;
    developer/API surface is increasingly delivered via the Docusign developer
    platform. This document intentionally carries an empty `paths` object
    because no public endpoints are documented; no endpoints are fabricated.
  termsOfService: https://www.lexion.ai/terms
  contact:
    name: Lexion (Docusign)
    url: https://www.lexion.ai/integrations/api
  version: '0.0.0'
servers: []
