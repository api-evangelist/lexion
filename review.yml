actions:
  openapiPath: openapi/lexion-openapi.yml
  apisYmlUpdated: true
  reason: |
    No public, self-serve API surface exists to model. The catalog documents
    Lexion's product surfaces and integration API honestly, with an empty
    OpenAPI paths object and an explicit acquisition note. Pricing is sales-led
    and recorded as reconciled:false.
