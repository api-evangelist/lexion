name: Lexion
kind: company
description: Lexion is an AI-powered contract lifecycle management (CLM) platform that
  centralizes agreements in an intelligent repository, extracts key terms and dates,
  and drives no-code intake and approval workflows across legal, sales, procurement,
  finance, and HR. Founded in 2019 out of the Allen Institute for AI, Lexion was acquired
  by Docusign in May 2024 for ~$165M and folded into Docusign's Intelligent Agreement
  Management (IAM) platform and Docusign Navigator. Lexion exposes an enterprise,
  sales-led integration API but does not publish a self-serve, openly documented public
  API.
