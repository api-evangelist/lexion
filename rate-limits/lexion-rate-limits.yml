specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Lexion
providerId: lexion
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Contract Management
- CLM
- AI
- Legal Tech
- Rate Limiting
- Quotas
description: >-
  Lexion does not publish a public API rate-limit or quota policy. Its
  integration API is an enterprise, sales-led offering without a documented
  self-serve developer reference, so request-per-minute, request-per-day, and
  concurrency limits (if any) are governed by individual enterprise agreements
  rather than a public rate card. No throttling response codes or quota tiers
  are documented publicly.
notes: >-
  No public rate-limit documentation exists for Lexion. Following the May 2024
  Docusign acquisition, programmatic limits for net-new integrations may be
  governed by the Docusign developer platform. Verify any applicable limits in
  the enterprise integration agreement during reconciliation.
sources:
- https://www.lexion.ai/integrations/api
- https://www.docusign.com/blog/lexion-acquisition-intelligent-agreement-management
responseCodes:
  throttled: not documented
limits:
- name: API Rate Limits
  scope: account
  metric: requests
  limit: not documented publicly
  notes: >-
    Governed by enterprise integration agreement; no public RPM/RPD/concurrency
    figures are published.
policies:
- name: Enterprise-Governed
  description: >-
    Any applicable limits are set per enterprise agreement, not via a public
    self-serve rate card.
- name: Docusign Platform
  description: >-
    Net-new integration limits may be governed by Docusign's developer platform
    post-acquisition.
